<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna · Connect</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070d1a; color: #f1f5f9;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    .card { width: 100%; max-width: 480px; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #94a3b8; margin: 0 0 18px; }
    .code { font: 15px/1.4 ui-monospace, Menlo, Consolas, monospace; background: #020617; border: 1px solid #334155;
            border-radius: 12px; padding: 14px; word-break: break-all; user-select: all; }
    button { margin-top: 14px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600;
             background: #6366f1; color: white; cursor: pointer; }
    button.done { background: #16a34a; }
    ol { color: #cbd5e1; padding-left: 20px; margin: 20px 0 0; }
    li { margin-bottom: 6px; }
    .bad { color: #f87171; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>
  <script>
    var q = new URLSearchParams(location.search);
    var code = q.get('code');
    var err = q.get('error_description') || q.get('error');
    var card = document.getElementById('card');
    var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
    if (code) {
      card.innerHTML =
        '<h1>Almost done ✅</h1>' +
        '<p>Copy this code and paste it into the workflow you ran on GitHub.</p>' +
        '<div class="code" id="code">' + esc(code) + '</div>' +
        '<button id="copy">Copy code</button>' +
        '<ol><li>Go back to GitHub → <b>Actions</b>.</li>' +
        '<li>Open the same <b>Connect</b> workflow → <b>Run workflow</b>.</li>' +
        '<li>Paste into the <b>code</b> box → green <b>Run workflow</b> button.</li></ol>' +
        '<p style="margin-top:16px">Do it within a few minutes; the code expires.</p>';
      document.getElementById('copy').onclick = function () {
        var b = this;
        navigator.clipboard.writeText(code).then(function () { b.textContent = 'Copied ✓'; b.className = 'done'; });
      };
    } else {
      card.innerHTML = '<h1 class="bad">No code here</h1><p>' +
        (err ? 'The service said: ' + esc(err) : 'This page only works right after approving access.') +
        '</p><p>Run the Connect workflow again with the code box empty to get a fresh link.</p>';
    }
  </script>
</body>
</html>
